# Grist + Bot API on 8445
server {
    listen 8445 ssl;
    server_name demo-daycare.66.94.122.133.sslip.io;

    ssl_certificate     /etc/nginx/certs/daycare.crt;
    ssl_certificate_key /etc/nginx/certs/daycare.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Grist web UI
    location / {
        proxy_pass http://grist:8484;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bot API
    location /api/bot/ {
        proxy_pass http://bot:8097/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# n8n on 8446
server {
    listen 8446 ssl;
    server_name demo-daycare.66.94.122.133.sslip.io;

    ssl_certificate     /etc/nginx/certs/daycare.crt;
    ssl_certificate_key /etc/nginx/certs/daycare.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
