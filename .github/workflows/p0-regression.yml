name: P0 Regression Suite

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  p0-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        run: pip install -r bot/requirements.txt

      - name: Run P0 regression suite
        run: python -m unittest -v tests/test_p0_regression.py
